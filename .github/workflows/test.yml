name: UI tests

# Runs on every pull request, and before every deploy (deploy.yml calls it). A failing test stops the deploy.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install test browsers
        run: npx playwright install --with-deps chromium webkit
      # Builds the site (type-checks it too), then tests the built files.
      - run: npm test
        env:
          CI: 'true'
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
